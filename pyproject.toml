[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chom"
version = "0.1.0"
description = "A community-driven, cross-platform package manager"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["tomli>=2; python_version < '3.11'"]
license = { text = "MIT" }
authors = [{ name = "chom contributors" }]

[project.scripts]
chom = "chom.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
